  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verdes do Mondego</title>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .header {
      text-align: center;
      padding: 32px 20px 20px;
    }
    .header-brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #14b8a6;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
    }
    .header-brand i { font-size: 1.3rem; }
    .header-tagline {
      color: #64748b;
      font-size: 0.85rem;
      margin-top: 4px;
    }
    .header-tags {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 8px;
      font-size: 0.8rem;
      color: #64748b;
    }
    .header-tags span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .header-tags i { font-size: 0.95rem; }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .plant-name {
      font-size: 2rem;
      font-weight: 700;
      color: #f1f5f9;
      line-height: 1.2;
    }
    .plant-desc {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .harvest-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-size: 0.85rem;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #14b8a6;
      flex-shrink: 0;
    }
    .badge-text { color: #14b8a6; font-weight: 500; }
    .badge-date { color: #64748b; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 16px;
    }
    .stat-box {
      background: #0f172a;
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
    }
    .stat-label { color: #64748b; font-size: 0.75rem; margin-bottom: 4px; }
    .stat-value { color: #14b8a6; font-weight: 700; font-size: 1rem; }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 16px;
    }
    .section-title i { font-size: 1.1rem; color: #14b8a6; }

    .trace-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 12px;
    }
    .trace-label { color: #64748b; font-size: 0.75rem; margin-bottom: 2px; }
    .trace-value { color: #14b8a6; font-weight: 600; font-size: 0.9rem; }
    .trace-divider { border: none; border-top: 1px solid #334155; margin: 12px 0; }
    .trace-note {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #64748b;
      font-size: 0.8rem;
    }
    .trace-note i { font-size: 1rem; color: #14b8a6; flex-shrink: 0; }

    .timeline-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid #0f172a;
    }
    .timeline-item:last-child { border-bottom: none; }

    .tl-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .tl-green  { background: rgba(20,184,166,.2);  color: #14b8a6; }
    .tl-purple { background: rgba(168,85,247,.2);  color: #a855f7; }
    .tl-yellow { background: rgba(234,179,8,.2);   color: #eab308; }
    .tl-blue   { background: rgba(14,165,233,.2);  color: #0ea5e9; }

    .tl-body { flex: 1; }
    .tl-phase { font-weight: 600; color: #e2e8f0; font-size: 0.95rem; }
    .tl-sub   { color: #64748b; font-size: 0.8rem; margin-top: 2px; }
    .tl-dur   { font-size: 0.85rem; font-weight: 600; color: #14b8a6; white-space: nowrap; padding-top: 2px; }
    .tl-dur-harvest { color: #14b8a6; font-size: 0.8rem; text-align: right; }

    .footer {
      text-align: center;
      padding: 24px 20px 8px;
      color: #475569;
      font-size: 0.8rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    .footer span { display: flex; align-items: center; gap: 4px; }
    .footer i { font-size: 0.95rem; }

    #state-loading { text-align: center; padding: 80px 20px; color: #64748b; }
    #state-loading i { font-size: 2rem; color: #14b8a6; display: block; margin-bottom: 12px; }
    #state-error   { text-align: center; padding: 80px 20px; color: #ef4444; display: none; }
    #state-error i { font-size: 2rem; display: block; margin-bottom: 12px; }
    #state-content { display: none; }
  </style>
</head>
<body>
  <div id="state-loading">
    <i class="ph ph-leaf"></i>
    <p>A carregar...</p>
  </div>

  <div id="state-error">
    <i class="ph ph-warning"></i>
    <p>Lote não encontrado.</p>
    <p style="font-size:0.8rem;margin-top:8px;color:#64748b">Verifique se o QR Code está correcto.</p>
  </div>

  <div id="state-content">
    <div class="header">
      <div class="header-brand">
        <i class="ph ph-leaf"></i>
        Verdes do Mondego
      </div>
    </div>

    <div class="container">

      <!-- Planta -->
      <div class="card">
        <div class="plant-name" id="plant-name"></div>
        <p class="plant-desc">Microverdes colhidos no momento ideal de maturação</p>
        <div class="harvest-badge">
          <div class="badge-dot"></div>
          <span class="badge-text" id="harvest-ago"></span>
          <span class="badge-date">·</span>
          <span class="badge-date" id="harvest-date"></span>
        </div>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-label">Ciclo</div>
            <div class="stat-value" id="stat-ciclo">—</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Semeadura</div>
            <div class="stat-value" id="stat-semeadura">—</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Origem</div>
            <div class="stat-value">Coimbra</div>
          </div>
        </div>
      </div>

      <!-- Rastreabilidade -->
      <div class="card">
        <div class="section-title">
          <i class="ph ph-check-circle"></i>
          Rastreabilidade
        </div>
        <div style="margin-bottom:12px">
          <div class="trace-label">Lote de Produção</div>
          <div class="trace-value" id="trace-id">—</div>
        </div>
        <hr class="trace-divider">
        <div class="trace-note">
          <i class="ph ph-map-pin"></i>
          <span>Produção local em Coimbra.</span>
        </div>
      </div>

      <!-- Linha do Tempo -->
      <div class="card">
        <div class="section-title">
          <i class="ph ph-info"></i>
          Linha do Tempo
        </div>
        <div id="timeline"></div>
      </div>

    </div>

    </div>

  <script>
    function fmtLong(iso) {
      if (!iso) return '—';
      return new Date(iso + 'T12:00:00').toLocaleDateString('pt-PT', {
        day: 'numeric', month: 'long', year: 'numeric'
      });
    }

    function fmtShort(iso) {
      if (!iso) return '—';
      return new Date(iso + 'T12:00:00').toLocaleDateString('pt-PT', {
        day: '2-digit', month: '2-digit'
      });
    }

    function fmtFull(iso) {
      if (!iso) return '—';
      return new Date(iso + 'T12:00:00').toLocaleDateString('pt-PT', {
        day: '2-digit', month: '2-digit', year: 'numeric'
      });
    }

    function daysSince(iso) {
      if (!iso) return null;
      const diff = Date.now() - new Date(iso + 'T12:00:00').getTime();
      return Math.floor(diff / 86400000);
    }

    function render(d) {
      document.getElementById('plant-name').textContent = d.planta;

      const days = daysSince(d.data_colheita);
      document.getElementById('harvest-ago').textContent =
        days === null ? 'Data desconhecida' :
        days === 0    ? 'Colhido hoje' :
                        `Colhido há ${days} dia${days !== 1 ? 's' : ''}`;
      document.getElementById('harvest-date').textContent = fmtLong(d.data_colheita);

      document.getElementById('stat-ciclo').textContent     = `${d.dias_producao} dias`;
      document.getElementById('stat-semeadura').textContent = fmtFull(d.data_plantio);

      document.getElementById('trace-id').textContent = `OP-${String(d.id).padStart(4, '0')}`;

      const phases = [
        {
          icon: 'ph-coffee-bean', cls: 'tl-green',
          label: 'Semeadura', sub: 'Início do ciclo de produção',
          right: fmtShort(d.data_plantio)
        },
        {
          icon: 'ph-leaf', cls: 'tl-green',
          label: 'Germinação', sub: 'Ambiente controlado sem luz',
          right: `${d.germinacao_dias} dias`
        },
        {
          icon: 'ph-moon', cls: 'tl-purple',
          label: 'Blackout', sub: 'Desenvolvimento das raízes',
          right: `${d.blackout_dias} dias`
        },
        {
          icon: 'ph-sun', cls: 'tl-yellow',
          label: 'Exposição', sub: 'Luz natural para síntese de nutrientes',
          right: `${d.exposicao_dias} dias`
        },
        {
          icon: 'ph-scissors', cls: 'tl-blue',
          label: 'Colheita', sub: 'Momento ideal de maturação',
          right: fmtLong(d.data_colheita), highlight: true
        },
      ];

      document.getElementById('timeline').innerHTML = phases.map(p => `
        <div class="timeline-item">
          <div class="tl-icon ${p.cls}"><i class="ph ${p.icon}"></i></div>
          <div class="tl-body">
            <div class="tl-phase">${p.label}</div>
            <div class="tl-sub">${p.sub}</div>
          </div>
          <div class="${p.highlight ? 'tl-dur-harvest' : 'tl-dur'}">${p.right}</div>
        </div>
      `).join('');

      document.getElementById('state-loading').style.display = 'none';
      document.getElementById('state-content').style.display = 'block';
    }

    function showError() {
      document.getElementById('state-loading').style.display = 'none';
      document.getElementById('state-error').style.display   = 'block';
    }

    async function load() {
      const id = new URLSearchParams(location.search).get('id');
      if (!id) { showError(); return; }
      try {
        const base = location.href.split('?')[0].replace(/\/?$/, '');
        const r = await fetch(`${base}/lots/${id}.json`);
        if (!r.ok) { showError(); return; }
        render(await r.json());
      } catch {
        showError();
      }
    }

    load();
  </script>
</body>
</html>
